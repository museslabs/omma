[package]
name = "omma"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "An eye-strain break reminder for the macOS menu bar"
repository = "https://github.com/museslabs/omma"
readme = "README.md"
keywords = ["macos", "health", "eye-strain", "break", "menu-bar"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# The objc2-* crates enable every binding by default. List each feature the
# code uses, even when another feature already turns it on.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSEnumerator",
    "NSGeometry",
    "NSKeyValueCoding",
    "NSObjCRuntime",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSSound",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CAAnimation",
    "CABase",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CATransaction",
] }
objc2-core-image = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CIContext",
    "CIFilter",
    "CIImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "HIServices",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColor",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
] }

[profile.release]
lto = true
strip = true
