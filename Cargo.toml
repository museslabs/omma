[package]
name = "omma"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "An eye-strain break reminder for the macOS menu bar and Wayland desktops"
repository = "https://github.com/museslabs/omma"
readme = "README.md"
# The bead's design files belong to the repository, not the crate.
exclude = ["design/"]
keywords = ["macos", "wayland", "health", "eye-strain", "break"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
regex = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glow = "0.17"
raw-window-handle = "0.6"
xkbcommon = { version = "0.9", default-features = false, features = ["wayland"] }
cosmic-text = "0.19"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# The objc2-* crates turn on every binding by default. List each feature that the
# code uses, also when another feature already turns it on.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSCalendar",
    "NSData",
    "NSDate",
    "NSEnumerator",
    "NSGeometry",
    "NSKeyValueCoding",
    "NSObjCRuntime",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSSound",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CAAnimation",
    "CABase",
    "CADisplayLink",
    "CAGradientLayer",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAShapeLayer",
    "CATransaction",
] }
objc2-core-image = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CIContext",
    "CIFilter",
    "CIImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "HIServices",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColor",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGPath",
] }

[profile.release]
lto = true
strip = true
