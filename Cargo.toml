[package]
name = "omma"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ὄμμα — a configurable eye-strain break reminder for macOS"
repository = "https://github.com/museslabs/omma"
keywords = ["macos", "health", "eye-strain", "break", "menu-bar"]
categories = ["command-line-utilities"]

[[bin]]
name = "omma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSValue",
    "NSArray",
    "NSDictionary",
    "NSTimer",
    "NSRunLoop",
    "NSThread",
    "NSBundle",
    "NSError",
    "NSAttributedString",
    "NSRange",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSEvent",
    "NSWindow",
    "NSPanel",
    "NSScreen",
    "NSView",
    "NSControl",
    "NSButton",
    "NSTextField",
    "NSText",
    "NSColor",
    "NSFont",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSImage",
    "NSSound",
    "NSWorkspace",
    "NSRunningApplication",
    "NSBox",
    "NSVisualEffectView",
    "NSGlassEffectView",
    "NSAttributedString",
    "NSFontDescriptor",
    "NSAppearance",
    "objc2-core-foundation",
] }

[profile.release]
lto = true
strip = true
